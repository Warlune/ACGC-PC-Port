services:
  host:
    build: .
    ports:
      - "27840:27840"
    volumes:
      - town:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:27840/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  town:
